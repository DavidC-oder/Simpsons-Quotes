<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Simpsons Quote Finder</title><meta name="description" content="There's a Simpsons quote for everything.">
<link rel="stylesheet" href="style.css"></head><body>
<header><h1>THE SIMPSONS<br>QUOTE FINDER</h1><p class="sub">There's a Simpsons quote for everything.</p></header>
<main>
<section class="search"><textarea id="q" rows="2" maxlength="300" placeholder="What's happening in your life?"></textarea>
<div class="row"><select id="char" aria-label="Character"></select><button id="go" class="btn">Find My Simpsons Quote</button></div>
<div id="sugg" class="chips"></div><div class="row"><button id="rand" class="btn alt">🎲 Random Quote</button><button id="favs" class="btn alt">♥ Favorites</button></div></section>
<p id="status" aria-live="polite"></p><section id="results"></section>
<div class="row"><button id="more" class="btn alt" hidden>Find More Quotes</button></div>
<section><h2>Quote of the Day</h2><div id="qotd"></div></section>
<section><h2>Recent Searches</h2><div id="recent" class="chips"></div></section>
</main><footer>Fan project. Not affiliated with or endorsed by The Simpsons or its rights holders.</footer>
<script src="app.js"></script></body></html>
